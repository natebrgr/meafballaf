<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MEGA BOUNCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050508;--panel:rgba(12,14,22,.88);--cyan:#00f0ff;--gold:#ffd700;--green:#00ff88;--red:#ff3355;--text:#e8f0ff;--dim:#8899bb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow:hidden;height:100%;height:100dvh;width:100%;font-family:'Exo 2',system-ui,sans-serif;background:var(--bg);color:var(--text);user-select:none;
background-image:radial-gradient(ellipse at 20% 20%,rgba(0,80,120,.15),transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(80,0,100,.12),transparent 50%)}

#title{pointer-events:none;white-space:nowrap;flex-shrink:0;font-size:1.05rem}
.sb{cursor:pointer;pointer-events:auto}
#title{font-family:'Orbitron',sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.08em;background:linear-gradient(90deg,var(--cyan),#ff00aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cg{display:flex;gap:10px;pointer-events:auto}
.cur{display:flex;align-items:center;gap:5px;font-family:'Orbitron',sans-serif;font-weight:600;font-size:.95rem;background:var(--panel);border:1px solid rgba(0,240,255,.25);border-radius:16px;padding:4px 10px;pointer-events:auto;cursor:pointer}
.ci{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff}
#cI{background:linear-gradient(135deg,#00e5ff,#0088ff)}#pI{background:linear-gradient(135deg,#ffd700,#ffaa00)}
.sb{position:absolute;z-index:20;background:var(--panel);border:1px solid rgba(0,240,255,.25);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;height:50px}
.sl{font-size:.48rem;letter-spacing:.12em;color:var(--dim);font-weight:600;text-transform:uppercase}
.sv{font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.25rem;line-height:1}
#lB{top:48px;left:2.5vw}#hB{top:48px;right:2.5vw}
#lvB{left:50%;transform:translateX(-50%);top:60px;width:110px;flex-direction:row;padding:0;overflow:hidden}
#wH,#lN{flex:1;display:flex;justify-content:center;align-items:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.4rem;height:100%}
#wH{border-right:1px solid rgba(0,240,255,.2);cursor:pointer}#lN{color:var(--green);text-shadow:0 0 10px rgba(0,255,136,.45);cursor:pointer}
canvas{
position:fixed;
left:2.5vw;
top:98px;
z-index:5;
border-radius:6px;
display:block;
touch-action:none;
/* width/height set by JS every layout */
}
#bB{
position:fixed;
left:2.5vw;
bottom:6px;
display:flex;
justify-content:space-between;
align-items:stretch;
gap:4px;
z-index:25;
box-sizing:border-box;
padding:0;
transform:none;
}
#topBar{
position:fixed;
left:2.5vw;
top:4px;
height:42px;
display:flex;
align-items:center;
justify-content:space-between;
z-index:30;
pointer-events:none;
box-sizing:border-box;
transform:none;
}
#cd{position:absolute;left:50%;transform:translateX(-50%);font-family:'Orbitron',sans-serif;font-weight:800;font-size:4rem;z-index:15;pointer-events:none;color:#fff;text-shadow:0 0 28px rgba(0,240,255,.8);opacity:0}
.cf{position:fixed;z-index:40;font-family:'Orbitron',sans-serif;font-weight:700;font-size:0;pointer-events:none;opacity:0;white-space:nowrap}
.cf.plus{color:var(--green);animation:fp 1.3s ease forwards}.cf.minus{color:var(--red);animation:fm 1.3s ease forwards}
@keyframes fp{0%{font-size:0;opacity:1}30%{font-size:1.25rem;opacity:1;transform:translateY(-8px) rotate(12deg)}70%{font-size:1.25rem;opacity:1}100%{font-size:0;opacity:0;transform:translateY(-18px)}}
@keyframes fm{0%{font-size:0;opacity:1}30%{font-size:1.25rem;opacity:1;transform:translateY(-8px) rotate(-12deg)}70%{font-size:1.25rem;opacity:1}100%{font-size:0;opacity:0;transform:translateY(-18px)}}
.sb.fg{animation:fg .5s ease}.sb.fr{animation:fr .5s ease}
@keyframes fg{0%,100%{border-color:rgba(0,240,255,.25)}50%{border-color:var(--green);box-shadow:0 0 14px rgba(0,255,136,.4)}}
@keyframes fr{0%,100%{border-color:rgba(0,240,255,.25)}50%{border-color:var(--red);box-shadow:0 0 14px rgba(255,50,80,.4)}}

button{font-family:'Orbitron',sans-serif;font-weight:600;font-size:.72rem;letter-spacing:.04em;padding:11px 12px;cursor:pointer;color:var(--text);background:var(--panel);border:1px solid rgba(0,240,255,.35);border-radius:4px;text-transform:uppercase;white-space:nowrap;flex:1 1 0;min-width:0;line-height:1.2;text-align:center;margin:0 4px}
button:first-child{margin-left:0}button:last-child{margin-right:0}
button:hover{background:rgba(0,240,255,.12);border-color:var(--cyan)}
#pB{background:linear-gradient(135deg,rgba(0,240,255,.15),rgba(0,100,150,.1));white-space:pre-line;line-height:1.15;padding:7px 12px;flex:1.15 1 0}
#pB.cr{border-color:rgba(255,215,0,.95)!important;color:var(--gold)!important;animation:gp .55s ease-in-out infinite}
@keyframes gp{0%,100%{box-shadow:0 0 8px rgba(255,215,0,.4);border-color:rgba(255,200,0,.7)}50%{box-shadow:0 0 22px rgba(255,215,0,.95),0 0 40px rgba(255,180,0,.45);border-color:#ffe566}}50%{box-shadow:0 0 20px rgba(255,215,0,.65)}}
#hBtn{border-color:rgba(0,255,136,.35);color:var(--green)}
button.gG{animation:aG .8s linear forwards}button.gR{animation:aR .8s linear forwards}button.gW{animation:aW .8s linear forwards}button.rc{animation:aC .25s linear forwards}
@keyframes aG{to{box-shadow:0 0 20px rgba(0,255,136,.7)}}@keyframes aR{to{box-shadow:0 0 20px rgba(255,50,80,.7)}}@keyframes aW{to{box-shadow:0 0 20px rgba(255,255,255,.6)}}@keyframes aC{to{box-shadow:0 0 0}}
.ov{position:fixed;inset:0;background:rgba(2,4,10,.94);backdrop-filter:blur(12px);z-index:100;display:none;flex-direction:column;align-items:center;padding:18px 14px;overflow-y:auto}
.ov.open{display:flex}
.oh{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ot{font-family:'Orbitron',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:.1em}
.oc{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.1rem;display:flex;align-items:center;justify-content:center;padding:0;margin:0;flex:none}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%;max-width:560px}
.sc{background:rgba(15,18,30,.9);border:1px solid rgba(0,240,255,.2);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.sc.eq{border-color:var(--gold);box-shadow:0 0 12px rgba(255,215,0,.25)}
.pv{width:58px;height:58px;border-radius:50%}.pv.bg{border-radius:8px;width:100%;height:48px}
.cn{font-size:.72rem;font-weight:600;text-align:center}.cp{font-family:'Orbitron',sans-serif;font-size:.65rem;color:var(--cyan)}
.cb{width:100%;padding:5px 0;font-size:.62rem;border-radius:5px;border:none;cursor:pointer;font-family:'Orbitron',sans-serif;font-weight:600}
.cb.buy{background:linear-gradient(135deg,#00c8e0,#0088cc);color:#fff}.cb.eqp{background:linear-gradient(135deg,#00cc77,#009955);color:#fff}
.cb.eqd{background:rgba(255,215,0,.2);color:var(--gold);border:1px solid rgba(255,215,0,.4)}.cb.lk{background:rgba(60,60,80,.5);color:#889;cursor:not-allowed}
.hc{width:100%;max-width:520px;font-size:.9rem;line-height:1.55;color:#c0d0e8}
.hc h3{font-family:'Orbitron',sans-serif;font-size:.88rem;letter-spacing:.08em;color:var(--cyan);margin:14px 0 6px}
.hc p{margin:0 0 8px}.hc ul{margin:0 0 10px;padding-left:18px}.hc li{margin-bottom:4px}
#tO{position:fixed;inset:0;background:rgba(2,4,10,.82);z-index:120;display:none;align-items:center;justify-content:center;padding:20px}
#tO.open{display:flex}
.tc{background:rgba(12,16,28,.97);border:1px solid rgba(0,240,255,.3);border-radius:14px;padding:20px;max-width:380px;width:100%;text-align:center}
.tc h2{font-family:'Orbitron',sans-serif;font-size:1.05rem;margin:0 0 8px;color:var(--cyan)}
.tc p{margin:0 0 14px;color:#c8d8f0;line-height:1.5;font-size:.9rem}
.si{font-size:.68rem;color:var(--dim);margin-bottom:10px;letter-spacing:.1em}
.tbr{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}.si-row .si{margin-bottom:0;flex:0 1 auto}.tt{width:100%;min-width:0;text-align:left}
.ta{flex-shrink:0;width:38px;height:38px;padding:0;font-size:1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.35);color:var(--cyan);margin:0}
.ta:disabled{opacity:.25}
.hn{display:flex;gap:10px;margin-top:14px;justify-content:center}
@media(max-width:480px){button{padding:9px 8px;font-size:.62rem}#pB{padding:6px 8px;font-size:.56rem}}

.cur{border:1px solid rgba(0,240,255,.25)}
.cur.cur-up{animation:curGlowUp .9s ease}
.cur.cur-down{animation:curGlowDown .9s ease}
@keyframes curGlowUp{
0%{box-shadow:0 0 0 transparent;border-color:rgba(0,240,255,.25);color:inherit;text-shadow:none}
20%,40%{box-shadow:0 0 18px rgba(0,255,136,.75),inset 0 0 12px rgba(0,255,136,.2);border-color:#00ff88;color:#00ff88;text-shadow:0 0 12px rgba(0,255,136,.8)}
100%{box-shadow:0 0 0 transparent;border-color:rgba(0,240,255,.25);color:inherit;text-shadow:none}
}
@keyframes curGlowDown{
0%{box-shadow:0 0 0 transparent;border-color:rgba(0,240,255,.25);color:inherit;text-shadow:none}
20%,40%{box-shadow:0 0 18px rgba(255,51,85,.75),inset 0 0 12px rgba(255,51,85,.2);border-color:#ff3355;color:#ff3355;text-shadow:0 0 12px rgba(255,51,85,.8)}
100%{box-shadow:0 0 0 transparent;border-color:rgba(0,240,255,.25);color:inherit;text-shadow:none}
}
.cur.cur-up span,.cur.cur-up .ci{animation:curTxtUp .9s ease}
.cur.cur-down span,.cur.cur-down .ci{animation:curTxtDown .9s ease}
@keyframes curTxtUp{0%,100%{color:inherit;text-shadow:none}20%,40%{color:#00ff88;text-shadow:0 0 12px rgba(0,255,136,.8)}}
@keyframes curTxtDown{0%,100%{color:inherit;text-shadow:none}20%,40%{color:#ff3355;text-shadow:0 0 12px rgba(255,51,85,.8)}}


#pD.pD-up{animation:pDGlowUp .9s ease}
#pD.pD-down{animation:pDGlowDown .9s ease}
@keyframes pDGlowUp{0%,100%{box-shadow:none;border-color:rgba(255,215,0,.35)}30%{box-shadow:0 0 14px rgba(0,255,136,.7);border-color:#00ff88}}
@keyframes pDGlowDown{0%,100%{box-shadow:none;border-color:rgba(255,215,0,.35)}30%{box-shadow:0 0 14px rgba(255,51,85,.7);border-color:#ff3355}}
#lvB{position:relative}
#cashBar{position:absolute;left:3px;right:3px;top:2px;height:3px;border-radius:2px;background:rgba(255,215,0,.12);overflow:hidden;pointer-events:none;z-index:2}
#cashBarFill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#b8860b,#ffd700,#fff1a8);box-shadow:0 0 6px rgba(255,215,0,.7);transition:width .3s ease}

#lN{transition:none}
#lN.lN-up{animation:lNGlowUp .9s ease}
#lN.lN-down{animation:lNGlowDown .9s ease}
@keyframes lNGlowUp{0%,100%{box-shadow:none;background:transparent;color:var(--green)}
30%{box-shadow:0 0 12px rgba(0,255,136,.7),inset 0 0 8px rgba(0,255,136,.15);background:rgba(0,255,136,.12);color:#00ff88}}
@keyframes lNGlowDown{0%,100%{box-shadow:none;background:transparent}
30%{box-shadow:0 0 12px rgba(255,51,85,.7),inset 0 0 8px rgba(255,51,85,.15);background:rgba(255,51,85,.12);color:#ff3355}}

#sB.sB-afford{animation:sBGlow 1.1s ease}
@keyframes sBGlow{0%,100%{box-shadow:none;border-color:rgba(0,240,255,.25)}
35%,55%{box-shadow:0 0 18px rgba(255,215,0,.85);border-color:#ffd700;color:#ffd700}}

#subHint{position:fixed;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;
font-family:'Orbitron',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:.06em;
text-align:center;opacity:0;visibility:hidden;transition:none;white-space:nowrap;
text-shadow:0 0 5px #000,0 1px 2px #000;
}
#subHint.show{opacity:0.75;visibility:visible}
#subHint.hi-match{color:#00cc6a;text-shadow:0 0 6px rgba(0,0,0,.9),0 0 4px rgba(0,200,100,.4)}
#subHint.hi-over{color:#cc2944;text-shadow:0 0 6px rgba(0,0,0,.9),0 0 4px rgba(200,40,60,.4)}
#subHint.hi-under{color:#a8b4c8;text-shadow:0 0 5px #000,0 1px 2px #000}

#sO .s-sticky{position:sticky;top:0;margin-bottom:10px;z-index:5;background:rgba(8,10,18,.97);backdrop-filter:blur(12px);
/* Full-bleed within .ov without clipping (matches .ov horizontal padding 14px) */
margin-left:-14px;margin-right:-14px;width:calc(100% + 28px);max-width:none;
padding:12px 16px 12px;box-sizing:border-box;
border-bottom:1px solid rgba(0,240,255,.15);
font-family:Orbitron;color:var(--cyan);text-align:center}
#sO .s-sticky .oh{position:relative;width:100%;max-width:560px;margin:0 auto 6px;padding:0 40px;box-sizing:border-box;justify-content:center}
#sO .s-sticky .ot{font-size:clamp(1.05rem,5.5vw,1.4rem);letter-spacing:0.08em;text-align:center;width:100%}
#sO .s-sticky .oc{position:absolute;right:0;top:50%;transform:translateY(-50%)}

#bB #sB,button#sB{color:#00e5ff!important;border-color:rgba(0,229,255,.65)!important;background:rgba(0,40,50,.35)!important}
#bB #sB:hover,button#sB:hover{color:#5ef0ff!important;border-color:#00e5ff!important;box-shadow:0 0 12px rgba(0,229,255,.4)!important}

#bB #hBtn,button#hBtn{color:#00ff88!important;border-color:rgba(0,255,136,.55)!important}
#bB #hBtn:hover,button#hBtn:hover{color:#66ffb3!important;border-color:#00ff88!important;box-shadow:0 0 12px rgba(0,255,136,.35)!important}

#pauseHint{position:fixed;left:50%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;
font-family:'Orbitron',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.08em;
text-align:center;opacity:0;visibility:hidden;color:#e8f0ff;white-space:nowrap;
text-shadow:0 0 6px #000,0 1px 3px #000}
#pauseHint.show{opacity:0.85;visibility:visible}

#sO.ov{padding-top:0}
#sO .s-sticky{top:0;margin-top:0;padding-top:14px}

#sO .s-sticky{margin-bottom:16px!important}
#sO .s-sticky + *{margin-top:4px}

/* Tutorial callouts for bounce count / goal */
.tutCall{position:fixed;z-index:125;display:none;flex-direction:column;align-items:center;gap:2px;pointer-events:none;
font-family:'Orbitron',sans-serif;font-size:.58rem;font-weight:700;letter-spacing:.04em;
color:#00e5ff;text-shadow:0 0 8px rgba(0,229,255,.5),0 1px 3px #000;white-space:nowrap}
.tutCall.show{display:flex}
.tutCallArr{font-size:1rem;line-height:1;color:#00e5ff;text-shadow:0 0 10px rgba(0,229,255,.7);margin-bottom:2px}
.tutCallTxt{margin-top:2px}
#lvB.tutHL{pointer-events:none!important;box-shadow:0 0 0 2px #00e5ff,0 0 16px rgba(0,229,255,.45)!important;border-color:#00e5ff!important;z-index:126;position:relative}
#wH.tutHL,#lN.tutHL{pointer-events:none!important;color:#fff!important;text-shadow:0 0 12px rgba(0,229,255,.9),0 0 4px #fff!important;
animation:tutPulse 1.2s ease-in-out infinite}
@keyframes tutPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
#wH.tutHL{box-shadow:inset 0 0 12px rgba(0,229,255,.25)}
#lN.tutHL{box-shadow:inset 0 0 12px rgba(0,255,136,.2)}

body.ui-locked #bB,body.ui-locked #topBar,body.ui-locked #lB,body.ui-locked #hB,body.ui-locked #lvB,
body.ui-locked #currency,body.ui-locked .cur,body.ui-locked canvas{
pointer-events:none!important;
}
</style>
</head>
<body>
<div id="topBar"><div id="title">MEGA BOUNCE</div><div class="cg">
<div class="cur" id="pD" style="display:none"><div class="ci" id="pI"></div><span id="pC">0</span></div>
<div class="cur"><div class="ci" id="cI">$</div><span id="cC">0</span></div>
</div></div>
<div class="sb" id="lB"><div class="sl">LIVES</div><div class="sv" id="lC">3</div></div>
<div class="sb" id="lvB"><div id="cashBar"><div id="cashBarFill"></div></div><div id="wH">0</div><div id="lN">1</div></div>
<div id="bcCall" class="tutCall tutCallL"><span class="tutCallArr">↑</span><span class="tutCallTxt">bounce count</span></div>
<div id="bgCall" class="tutCall tutCallR"><span class="tutCallArr">↑</span><span class="tutCallTxt">bounce goal</span></div>
<div class="sb" id="hB"><div class="sl">HI-SCORE</div><div class="sv" id="hC">0</div></div>
<div id="pauseHint">GAME IS PAUSED...</div><div id="subHint">NEXT TOUCH SUBMITS!</div><div id="cd">3</div>
<div class="cf" id="lCh"></div><div class="cf" id="lvCh"></div><div class="cf" id="cCh"></div><div class="cf" id="hCh"></div>
<canvas id="canvas"></canvas>
<div id="bB">
<button id="sB">STORE</button><button id="mB">MODE</button><button id="pB">PAUSE</button>
<button id="mpB">MAP</button><button id="hBtn">HELP</button>
</div>
<div class="ov" id="sO"><div class="s-sticky"><div class="oh"><div class="ot" style="background:linear-gradient(90deg,var(--gold),#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent">STORE</div><button class="oc" id="sCl">X</button></div>
<div style="font-family:Orbitron;color:var(--cyan)">$ <span id="sCC">0</span></div>
<div style="font-family:Exo 2,sans-serif;font-size:.72rem;color:rgba(200,210,230,.75);margin-top:6px;padding:0 12px">Items unlock with Survival high scores.</div>
</div>
<div style="width:100%;max-width:560px;margin-bottom:20px"><div style="font-family:Orbitron;font-size:.78rem;color:var(--dim);margin-bottom:8px;letter-spacing:.12em">CIRCLE SKINS</div><div class="sg" id="skG"></div></div>
<div style="width:100%;max-width:560px"><div style="font-family:Orbitron;font-size:.78rem;color:var(--dim);margin-bottom:8px;letter-spacing:.12em">BACKGROUNDS</div><div class="sg" id="bgG"></div></div>
</div>
<div class="ov" id="hO"><div class="oh"><div class="ot" style="background:linear-gradient(90deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent">DIRECTIONS</div><button class="oc" id="hCl">X</button></div>
<div class="hc" id="hCo"></div><div class="hn"><button id="hCb">GOT IT</button></div></div>

<div class="ov" id="infoO"><div class="oh"><div class="ot" id="infoTitle" style="background:linear-gradient(90deg,var(--gold),#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent">INFO</div><button class="oc" id="infoCl">X</button></div>
<div class="hc" id="infoBody" style="max-width:440px"></div>
<div class="hn"><button id="infoCb">GOT IT</button></div></div>
<div id="tO"><div class="tc"><div class="tbr si-row"><button class="ta" id="tP">&#8249;</button><div class="si" id="tS">STEP 1 / 5</div><button class="ta" id="tNA">&#8250;</button></div>
<div class="tt"><h2 id="tT"></h2><p id="tB"></p></div>
<div class="hn"><button id="tSk">SKIP</button><button id="tN">NEXT</button></div></div></div>
<script type="text/javascript">

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const lN=$('lN'),cd=$('cd'),wH=$('wH'),lC=$('lC'),lB=$('lB'),hC=$('hC'),hB=$('hB');
const cC=$('cC'),pC=$('pC'),pD=$('pD'),title=$('title'),mB=$('mB'),mpB=$('mpB'),pB=$('pB');
const sB=$('sB'),hBtn=$('hBtn'),sO=$('sO'),sCl=$('sCl'),sCC=$('sCC'),skG=$('skG'),bgG=$('bgG');

function constrain(){

}

function drawBg(w,h){

else if(bg.t==='stars'){for(let i=0;i<80;i++){ctx.beginPath();ctx.arc((i*137.5)%w,(i*97.3)%h,(i%3)+0.5,0,Math.PI*2);ctx.fillStyle=`rgba(200,220,255,${0.3+(i%5)*0.1})`;ctx.fill()}}

function clearCDTimer(){if(cdInt){clearTimeout(cdInt);cdInt=null}}
function scheduleCD(){
clearCDTimer();
if(!isCD||isPaused)return;
cdTickAt=Date.now();
const wait=Math.max(16,cdRemain);
cdInt=setTimeout(function cdTick(){
// Ignore stale ticks if paused or countdown already cleared
if(!isCD||isPaused){cdInt=null;return}
cdVal--;
if(cdVal>0){
cd.textContent=cdVal;
cdRemain=1000;
cdTickAt=Date.now();
cdInt=setTimeout(cdTick,1000);
}else{
cdOp=0;cd.style.opacity=0;cdInt=null;isCD=false;cdRemain=1000;
updDisp();updateHint();
}
},wait);
}
function pauseCD(){
if(!isCD)return;
// Always freeze remaining time on the CURRENT second, even if timer id was lost
if(cdTickAt){
const elapsed=Date.now()-cdTickAt;
cdRemain=Math.max(16,cdRemain-elapsed);
}
cdTickAt=0;
clearCDTimer();
}
function resumeCD(){
if(!isCD)return;
if(isPaused)return;
// Continue the same second with whatever fraction is left
if(!(cdRemain>0))cdRemain=1000;
scheduleCD();
}
function startCD(res){
if(!res){
isCD=true;cdVal=3;wallHits=0;wH.textContent='0';
wH.style.color='#e8f0ff';wH.style.textShadow='none';
isTrack=true;cdOp=1;cdRemain=1000;zoneScroll=0;
}else{
isCD=true;
// resuming an existing countdown — keep cdVal and cdRemain as-is
}
cd.style.opacity=cdOp;cd.textContent=String(cdVal);
clearCDTimer();

function springBack(rx,ry){const dx=rx-gold.hx,dy=ry-gold.hy,dist=Math.hypot(dx,dy)||1;gold.wDx=dx/dist;gold.wDy=dy/dist;gold.wA=Math.min(28,8+dist*0.22);gold.wT=0;gold.wob=true;gold.drag=false;gold.tid=null}

function getPos(e,tid){const rect=canvas.getBoundingClientRect();if(tid!==null&&e.touches){for(let i=0;i<e.touches.length;i++)if(e.touches[i].identifier===tid)return{x:e.touches[i].clientX-rect.left,y:e.touches[i].clientY-rect.top}}
return{x:(e.clientX||(e.touches&&e.touches[0]&&e.touches[0].clientX)||0)-rect.left,y:(e.clientY||(e.touches&&e.touches[0]&&e.touches[0].clientY)||0)-rect.top}}
function getScr(e,tid){if(tid!==null&&(e.touches||e.changedTouches)){const ts=e.changedTouches||e.touches;for(let i=0;i<ts.length;i++)if(ts[i].identifier===tid)return{x:ts[i].clientX,y:ts[i].clientY}}
return{x:e.clientX||(e.touches&&e.touches[0]&&e.touches[0].clientX)||(e.changedTouches&&e.changedTouches[0]&&e.changedTouches[0].clientX)||0,y:e.clientY||(e.touches&&e.touches[0]&&e.touches[0].clientY)||(e.changedTouches&&e.changedTouches[0]&&e.changedTouches[0].clientY)||0}}

function completeLevel(oy,ch){
const completed=level;level++;if(mode==='freebie')coins+=1;potential=(level-1)*lives;updTM();
if(mode==='survival'&&map==='rectangle'){
const sH=ch/3,period=3*sH;
const content=oy-zoneScroll;
const adj=((content%period)+period)%period;
const sec=Math.min(2,Math.floor(adj/sH));
const absK=Math.floor(content/period); // absolute band in content space
const tier=Math.max(0,-absK);
let base;if(startL>3&&lives<3)base=3;else if(startL>3&&lives>2)base=lives;else base=startL;
let target;if(sec===gSec)target=base+1+tier;
else if(sec===rSec)target=Math.max(base-1-tier,1);
else target=base;
lives=Math.max(1,target);
potential=(level-1)*lives;pLand=sec;
}
else if(mode==='survival'){lives=3;potential=(level-1)*lives}
if(completed>gHS())sHS(completed);wallHits=0;startL=lives;pgSec=gSec;prSec=rSec;gSec=ngSec;rSec=nrSec;asNext();
if(mode==='survival'){
// Original timing: first opportunity at level 2, then gaps grow (2,3,4,...)
if(cashAvail){cashAvail=false;nextCO=nextCO+curInc;curInc=Math.max(2,curInc-1)}
if(level===nextCO){cashAvail=true;resetGold()}
}else{cashAvail=false}
zoneScroll=0;spawnP(circle.x,circle.y,12,'#fff');saveSt();updDisp();startCD();updateHint();
}


function startResizing(e){
if(!circle.isDragging||circle.isResizing)return;
if(isPaused&&!circle.wasDraggingWhenPaused)return;
if(e.touches&&e.touches.length>=2){
const dragIdx=Array.from(e.touches).findIndex(t=>t.identifier===circle.dragTouchId);
if(dragIdx===-1)return;
const other=e.touches[dragIdx===0?1:0];
const pos=getPos(e,other.identifier);
const rect=canvas.getBoundingClientRect();
if(other.clientX<rect.left||other.clientX>rect.right||other.clientY<rect.top||other.clientY>rect.bottom)return;
circle.resizeTouchId=other.identifier;circle.resizeStartX=pos.x;circle.resizeStartY=pos.y;
circle.initR=circle.radius;circle.rsTime=Date.now();
if(circle.rsTimer)clearTimeout(circle.rsTimer);
circle.rsTimer=setTimeout(()=>{if(circle.resizeTouchId!==null)circle.isResizing=true},200);
}
}
function startMouseResize(e){
// Allow while paused if ball was held when paused (holding state)
const held=circle.isDragging||(isPaused&&circle.wasDraggingWhenPaused);
if(!held||circle.isResizing)return;
if(e.button!==2)return;
e.preventDefault();
const pos=getPos(e,null);
circle.resizeTouchId='mouse-right';circle.resizeStartX=pos.x;circle.resizeStartY=pos.y;
circle.initR=circle.radius;circle.rsTime=Date.now();rightResize=true;
circle.isResizing=false; // wait for vertical movement before resizing; short click = drop
}
function applyResize(pos){
const w=viewW,h=viewH,pw=w-2*SSW;
let newR;
if(circle.resizeTouchId==='mouse-right'){
// Mouse: vertical drag — move up to grow, down to shrink
const deltaY=circle.resizeStartY-pos.y; // up = positive
newR=Math.max(DEF_R,circle.initR+deltaY/2);
}else{
// Touch: drag second finger away/toward ball
const dx=pos.x-circle.x,dy=pos.y-circle.y;
const curD=Math.hypot(dx,dy);
const initD=Math.hypot(circle.resizeStartX-circle.x,circle.resizeStartY-circle.y);
newR=Math.max(DEF_R,circle.initR+(curD-initD)/2);
}
let maxR;
if(map==='rectangle'){maxR=Math.min(circle.x-SSW,w-SSW-circle.x,circle.y,h-circle.y)}
else{const cx=w/2,cy=h/2,rad=Math.min(pw,h)/2-BW;maxR=Math.max(DEF_R,rad-Math.hypot(circle.x-cx,circle.y-cy))}
circle.radius=Math.min(newR,maxR);constrain();
}
function dropBall(){
// Release ball with zero velocity so it falls straight down
circle.isDragging=false;circle.dragTouchId=null;circle.dx=0;circle.dy=0;
circle.wasDraggingWhenPaused=false;
}
function stopResizing(e){
if(circle.resizeTouchId===null&&!rightResize)return;
if(e&&e.touches&&e.touches.length>1)return;
if(e&&e.changedTouches){let m=false;for(let i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===circle.resizeTouchId)m=true;if(!m&&circle.resizeTouchId!=='mouse-right')return}
const didResize=circle.isResizing;
if(circle.rsTimer){clearTimeout(circle.rsTimer);circle.rsTimer=null}
circle.isResizing=false;circle.resizeTouchId=null;rightResize=false;
// Short click/tap without resizing = drop — but NEVER while paused (keep holding state)
if(!didResize&&circle.isDragging&&!isPaused){dropBall();draw()}
}

function handleTap(e){
if(uiLocked)return;
if(isPaused)return;
const pos=getPos(e);const w=viewW,h=viewH;
if(pos.x<SSW||pos.x>w-SSW)return;e.preventDefault();
const ox=circle.x,oy=circle.y;if(circle.isDragging)return;
if(!circle.hasBeenTouched||postGame){postGame=false;uiLocked=false;zoneScroll=0;circle.hasBeenTouched=true;isTrack=false;wallHits=0;startCD();circle.x=pos.x;circle.y=pos.y;circle.dx=0;circle.dy=0;constrain();updDisp();return}
let bg='rgba(180,180,180,0.4)';
if(mode==='survival'&&map==='rectangle'){
const sH=h/3,period=3*sH,adj=(((oy-zoneScroll)%period)+period)%period,sec=Math.min(2,Math.floor(adj/sH));
if(sec===gSec)bg='rgba(0,180,90,0.6)';else if(sec===rSec)bg='rgba(180,30,50,0.6)';
}
holes.push({x:ox,y:oy,st:Date.now(),bg,op:1});
if(isCD){if(wallHits===level){isTrack=false;if(cdInt){clearCDTimer();cdOp=0;cd.style.opacity=0;isCD=false}completeLevel(oy,h);updateHint();circle.x=pos.x;circle.y=pos.y;constrain();return}circle.x=pos.x;circle.y=pos.y;constrain();updateHint();return}
if(wallHits===level)completeLevel(oy,h);
else if(mode==='survival'){
lives--;potential=(level-1)*lives;
if(lives<=0){endGame();return;} // death tap ends run only — does not start next
wallHits=0;saveSt();updDisp();startCD();
}else{wallHits=0;zoneScroll=0;startCD()}

function startDrag(e){
if(uiLocked)return;
if(postGame)return; // don't grab the ball on the death tap
const pos=getPos(e,e.touches?e.touches[0].identifier:null);const tid=e.touches?e.touches[0].identifier:null;
if(isPaused&&cashAvail&&mode==='survival'&&mergeA<=0){if(Math.hypot(pos.x-gold.x,pos.y-gold.y)<=gold.r+12){e.preventDefault();gold.drag=true;gold.tid=tid;gold.ox=pos.x-gold.x;gold.oy=pos.y-gold.y;draw();return}}
if(isPaused&&!circle.wasDraggingWhenPaused)return;

circle.isDragging=true;circle.dragTouchId=tid;zoneScroll=0;circle.lastX=pos.x;circle.lastY=pos.y;circle.lastTime=Date.now();circle.dx=circle.dy=0;circle.x=pos.x;circle.y=pos.y;constrain();

function drag(e){
const w=viewW,h=viewH,pw=w-2*SSW,now=Date.now();
if(circle.resizeTouchId!==null||rightResize){
const pos=getPos(e,circle.resizeTouchId==='mouse-right'?null:circle.resizeTouchId);
if(circle.resizeTouchId==='mouse-right'||rightResize){
const moved=Math.abs(pos.y-circle.resizeStartY);
if(!circle.isResizing&&moved>6){circle.isResizing=true}
}
if(circle.isResizing){applyResize(pos);draw();return}
}
if(gold.drag){const pos=getPos(e,gold.tid);gold.x=Math.max(gold.r,Math.min(w-gold.r,pos.x-gold.ox));gold.y=Math.max(gold.r,Math.min(h-gold.r,pos.y-gold.oy));draw();return}
if(circle.isDragging&&!circle.isResizing){const pos=getPos(e,circle.dragTouchId);
if(map==='rectangle'){pos.x=Math.max(SSW+circle.radius,Math.min(w-SSW-circle.radius,pos.x));pos.y=Math.max(circle.radius,Math.min(h-circle.radius,pos.y))}
else{const cx=w/2,cy=h/2,mr=Math.min(pw,h)/2-BW-circle.radius;const dx=pos.x-cx,dy=pos.y-cy,d=Math.hypot(dx,dy);if(d>mr){const a=Math.atan2(dy,dx);pos.x=cx+Math.cos(a)*mr;pos.y=cy+Math.sin(a)*mr}}
circle.x=pos.x;circle.y=pos.y;if(!isPaused){const dt=(now-circle.lastTime)/1000;if(dt>0){circle.dx=((pos.x-circle.lastX)/dt)*throwMul;circle.dy=((pos.y-circle.lastY)/dt)*throwMul}circle.lastTime=now}circle.lastX=pos.x;circle.lastY=pos.y}
const scr=getScr(e,circle.dragTouchId);const target=document.elementFromPoint(scr.x,scr.y);
const chk=(btn,key,fn)=>{if(target===btn){if(!holdT[key]&&!btnAct[key]){btn.classList.remove('gG','gR','gW','rc');if(key==='play')btn.classList.add(isPaused?'gG':'gR');else btn.classList.add('gW');
holdT[key]=setTimeout(()=>{if(circle.isDragging&&document.elementFromPoint(scr.x,scr.y)===btn){btn.classList.remove('gG','gR','gW');btn.classList.add('rc');fn();btnAct[key]=true}holdT[key]=null},HOLD_THR)}}
else{if(holdT[key]){clearTimeout(holdT[key]);holdT[key]=null;btn.classList.remove('gG','gR','gW');btn.classList.add('rc')}if(btnAct[key]&&target!==btn)btnAct[key]=false}};
chk(pB,'play',()=>{if(isPaused){isPaused=false;resumeCD();resetGold();circle.lastX=getPos(e,circle.dragTouchId).x;circle.lastY=getPos(e,circle.dragTouchId).y;circle.lastTime=Date.now();circle.dx=circle.dy=0;/* CD already resumed via resumeCD */}else{circle.wasDraggingWhenPaused=circle.isDragging;pauseCD();isPaused=true;saveSt();updateHint()}updDisp();draw()});
chk(mB,'mode',()=>{if(!isPaused)circle.wasDraggingWhenPaused=circle.isDragging;isPaused=true;pauseCD();saveSt();mode=mode==='survival'?'freebie':'survival';circle.hasBeenTouched=false;loadSt(mode,map)});
chk(mpB,'map',()=>{if(!isPaused)circle.wasDraggingWhenPaused=circle.isDragging;isPaused=true;pauseCD();saveSt();map=map==='rectangle'?'circle':'rectangle';circle.hasBeenTouched=false;loadSt(mode,map)});
chk(sB,'store',()=>{if(!isPaused)circle.wasDraggingWhenPaused=circle.isDragging;isPaused=true;pauseCD();saveSt();openStore()});

if(isPaused)saveSt();draw();
}

hCo.innerHTML="<h3>The Goal<\/h3><p>Stop the ball in its tracks when its bounce count exactly matches the level number. Level 1 needs exactly 1 bounce, level 2 needs exactly 2, and so on. One bounce over or under and you lose a life (Survival). Lives also act as your score multiplier. Level starts at 1 and resets to 1 when a new Survival game starts.<\/p>\n<p>The right number in the center box is the target. The left number is your live bounce count.<\/p>\n<h3>Throwing &amp; Submitting<\/h3>\n<ul><li>Tap anywhere inside the play area to spawn the ball at that spot. It will fall under gravity from there.<\/li>\n<li>If you keep holding after the tap, the ball stays in your grasp until you release or fling it.<\/li>\n<li>The first tap also starts a <strong>3-second countdown<\/strong>. That countdown is the time window you have to stack up bounces; after the countdown, the next touch in the map will submit your bounce count. At higher levels you will often need several throws inside those 3 seconds because gravity slows the ball down.<\/li>\n<li>Bounces keep counting during the countdown and after it ends.<\/li>\n<li>To <strong>submit<\/strong> your current bounce count: after the countdown (or even during it once you have started), tap, hold, or flick anywhere inside the map. That action locks in the result and resets the countdown for either your next try at that level, or the next level if the bounce count matched the level number.<\/li>\n<li>The crosshair in the center of the ball marks the exact position used when you submit.<\/li><\/ul>\n<h3>Survival Mode (MEGA BOUNCE)<\/h3>\n<p>You have limited lives. Each new run starts with <strong>3 lives<\/strong>, and lives reset to 3 when a new game begins (after cash-out or game over). On the Rectangle map the play area is split into three horizontal zones. When you clear a level, the zone the ball is in at the moment you submit changes your lives (the +/- numbers adjust at lower life amounts):<\/p>\n<ul><li><span style=\"color:#00ff88\">Green<\/span> &rarr; gain a life<\/li><li><span style=\"color:#ff3355\">Red<\/span> &rarr; lose a life<\/li><li>Black &rarr; no change<\/li><\/ul>\n<p>The side strips show the previous and upcoming zone colors (left and right sides, respectively). You can see which color you previously landed on (outlined in white), and which colors are next up.<\/p>\n<p><strong>Potential payout<\/strong> = the last level you beat this run &times; your current lives.<\/p>\n<h3>Lives Recovery<\/h3>\n<p>The +/- numbers on the zones adjust at lower lives amounts based on how many lives you started the level with:<\/p>\n<ul><li><strong>Started at 3 or more lives:<\/strong> If you drop below 3, black returns you to 3, green bumps you up to 4, red keeps you at or returns you to 2.<\/li>\n<li><strong>Started at 2 lives:<\/strong> If you drop below 2, black returns you to 2, green bumps you up to 3, red keeps you at 1.<\/li>\n<li><strong>Started at 1 life:<\/strong> Black and red keep you at 1, green bumps you to 2.<\/li><\/ul>\n<h3>Cash Out<\/h3>\n<p>The first cash-out opportunity appears at <strong>level 16<\/strong> (after you have beaten 15 levels). Each time you skip one, the gap to the next shrinks (14 levels, then 13, and so on) until it settles at every 2 levels.<\/p>\n<p>When it is available, the map border and Pause button pulse gold, and the Pause button reads &ldquo;PAUSE/ CASH OUT&rdquo; (on two lines). Cash out now if you want, or keep playing for a later shot. Pause to bring up the gold circle and blue $. Drag the gold circle onto the blue $ and release to cash out: you receive $ equal to (last level beaten &times; current lives) and the run resets.<\/p>\n<h3>Free Mode (FREE BOUNCE)<\/h3>\n<p>Infinite lives. Every successful level awards +1 $. Ideal for practice, and unlimited attempts to beat levels &mdash; the level you reach is saved and never resets.<\/p>\n<h3>Maps<\/h3>\n<ul><li><strong>Rectangle<\/strong> &mdash; four walls plus the colored life zones in Survival.<\/li><li><strong>Circle<\/strong> &mdash; circular boundary, no life zones.<\/li><\/ul>\n<h3>Extra Controls<\/h3>\n<ul>\n<li><strong>Resize (touch):<\/strong> hold the ball with one finger, place a second finger on the map, hold briefly, then drag that finger away to grow the ball or toward it to shrink it.<\/li>\n<li><strong>Resize (mouse):<\/strong> left-click and hold the ball, then right-click and drag <em>up<\/em> to grow or <em>down<\/em> to shrink.<\/li>\n<li><strong>Drop straight down (touch):<\/strong> while holding the ball, tap elsewhere on the map with another finger to release it so it falls straight down from your grasp.<\/li>\n<li><strong>Drop straight down (mouse):<\/strong> while left-click holding the ball, right-click once (without dragging) to drop it straight down.<\/li>\n<li>You can preserve the ball&rsquo;s holding state across pause/resume. While holding the ball, drag onto Pause, Map, Mode, Store, or Help and either wait for the button to glow-activate or simply release on it &mdash; both save the holding state. Resume the same way to continue with the ball still in your grasp. Tapping Resume without holding the ball resumes in a free (non-holding) state.<\/li>\n<\/ul>";

function startTut(){setUiLocked(false);tutI=0;showTut()}

function animate(){try{
// Re-assert canvas buffer every frame — iOS/Snapchat often resets it
const pr=Math.min(window.devicePixelRatio||1,2);
const bw=Math.floor(viewW*pr),bh=Math.floor(viewH*pr);
if(canvas.width!==bw||canvas.height!==bh){canvas.width=bw;canvas.height=bh;ctx.setTransform(pr,0,0,pr,0,0)}
phys();draw();
}catch(err){console.error(err)}requestAnimationFrame(animate)}
