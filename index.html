<!DOCTYPE html>

<style>

.cg{display:flex;gap:10px;pointer-events:auto}
.cur{display:flex;align-items:center;gap:5px;font-family:Orbitron,sans-serif;font-weight:600;font-size:.95rem;background:var(--panel);border:1px solid rgba(0,240,255,.25);border-radius:16px;padding:4px 10px;pointer-events:auto;cursor:pointer}
.ci{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff}

.sv{font-family:Orbitron,sans-serif;font-weight:700;font-size:1.25rem;line-height:1}
#lB{top:48px;left:2.5vw}#hB{top:48px;right:2.5vw}

#wH{border-right:1px solid rgba(0,240,255,.2);cursor:pointer}#lN{color:var(--green);text-shadow:0 0 10px rgba(0,255,136,.45);cursor:pointer}
canvas{

width:auto;

}
#bB{
position:fixed;
left:2.5vw;
right:2.5vw;
bottom:6px;
width:auto;
display:flex;
justify-content:space-between;
align-items:stretch;
gap:4px;
z-index:25;

padding:0;

}
#topBar{
position:fixed;
left:2.5vw;
right:2.5vw;
top:4px;
width:auto;
height:42px;
display:flex;
align-items:center;
justify-content:space-between;
z-index:30;
pointer-events:none;

#cd{position:absolute;left:50%;transform:translateX(-50%);font-family:Orbitron,sans-serif;font-weight:800;font-size:4rem;z-index:15;pointer-events:none;color:#fff;text-shadow:0 0 28px rgba(0,240,255,.8);opacity:0}
.cf{position:absolute;z-index:25;font-family:Orbitron,sans-serif;font-weight:700;font-size:0;pointer-events:none;opacity:0}
.cf.plus{color:var(--green);animation:fp 1.3s ease forwards}.cf.minus{color:var(--red);animation:fm 1.3s ease forwards}
@keyframes fp{0%{font-size:0;opacity:1;transform:translate(0,0) rotate(0)}30%{font-size:1.25rem;opacity:1;transform:translate(3px,0) rotate(8deg)}70%{font-size:1.25rem;opacity:1;transform:translate(3px,0) rotate(4deg)}100%{font-size:0;opacity:0;transform:translate(8px,0) rotate(0)}}
@keyframes fm{0%{font-size:0;opacity:1;transform:translate(0,0) rotate(0)}30%{font-size:1.25rem;opacity:1;transform:translate(3px,0) rotate(-8deg)}70%{font-size:1.25rem;opacity:1;transform:translate(3px,0) rotate(-4deg)}100%{font-size:0;opacity:0;transform:translate(8px,0) rotate(0)}}
.sb.fg{animation:fg .5s ease}.sb.fr{animation:fr .5s ease}

@keyframes aG{to{box-shadow:0 0 20px rgba(0,255,136,.7)}}@keyframes aR{to{box-shadow:0 0 20px rgba(255,50,80,.7)}}@keyframes aW{to{box-shadow:0 0 20px rgba(255,255,255,.6)}}@keyframes aC{to{box-shadow:0 0 0}}
.ov{position:fixed;inset:0;background:rgba(2,4,10,.94);backdrop-filter:blur(12px);z-index:100;display:none;flex-direction:column;align-items:center;padding:18px 14px;overflow-y:auto}

.sc{background:rgba(15,18,30,.9);border:1px solid rgba(0,240,255,.2);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}

.pv{width:58px;height:58px;border-radius:50%}.pv.bg{border-radius:8px;width:100%;height:48px}
.cn{font-size:.72rem;font-weight:600;text-align:center}.cp{font-family:Orbitron,sans-serif;font-size:.65rem;color:var(--cyan)}
.cb{width:100%;padding:5px 0;font-size:.62rem;border-radius:5px;border:none;cursor:pointer;font-family:Orbitron,sans-serif;font-weight:600}

.hc{width:100%;max-width:520px;font-size:.9rem;line-height:1.55;color:#c0d0e8}
.hc h3{font-family:Orbitron,sans-serif;font-size:.88rem;letter-spacing:.08em;color:var(--cyan);margin:14px 0 6px}
.hc p{margin:0 0 8px}.hc ul{margin:0 0 10px;padding-left:18px}.hc li{margin-bottom:4px}
#tO{position:fixed;inset:0;background:rgba(2,4,10,.82);z-index:120;display:none;align-items:center;justify-content:center;padding:20px}
#tO.open{display:flex}
.tc{background:rgba(12,16,28,.97);border:1px solid rgba(0,240,255,.3);border-radius:14px;padding:20px;max-width:380px;width:100%;text-align:center}
.tc h2{font-family:Orbitron,sans-serif;font-size:1.05rem;margin:0 0 8px;color:var(--cyan)}
.tc p{margin:0 0 14px;color:#c8d8f0;line-height:1.5;font-size:.9rem}
.si{font-size:.68rem;color:var(--dim);margin-bottom:10px;letter-spacing:.1em}
.tbr{display:flex;align-items:center;gap:6px;margin-bottom:6px}.tt{flex:1;min-width:0}
.ta{flex-shrink:0;width:38px;height:38px;padding:0;font-size:1.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.35);color:var(--cyan);margin:0}
.ta:disabled{opacity:.25}
.hn{display:flex;gap:10px;margin-top:14px;justify-content:center}
@media(max-width:480px){button{padding:9px 8px;font-size:.62rem}#pB{padding:6px 8px;font-size:.56rem}}
</style>
</head>
<body>
<div id="topBar"><div id="title">MEGA BOUNCE</div><div class="cg">
<div class="cur" id="pD" style="display:none"><div class="ci" id="pI"></div><span id="pC">0</span></div>
<div class="cur"><div class="ci" id="cI">$</div><span id="cC">0</span></div>
</div></div>
<div class="sb" id="lB"><div class="sl">LIVES</div><div class="sv" id="lC">3</div></div>
<div class="sb" id="lvB"><div id="wH">0</div><div id="lN">1</div></div>

<div class="tbr"><button class="ta" id="tP">&#8249;</button><div class="tt"><h2 id="tT"></h2><p id="tB"></p></div><button class="ta" id="tNA">&#8250;</button></div>
<div class="hn"><button id="tSk">SKIP</button><button id="tN">NEXT</button></div></div></div>
<script type="text/javascript">

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const lN=$('lN'),cd=$('cd'),wH=$('wH'),lC=$('lC'),lB=$('lB'),hC=$('hC'),hB=$('hB');
const cC=$('cC'),pC=$('pC'),pD=$('pD'),title=$('title'),mB=$('mB'),mpB=$('mpB'),pB=$('pB');
const sB=$('sB'),hBtn=$('hBtn'),sO=$('sO'),sCl=$('sCl'),sCC=$('sCC'),skG=$('skG'),bgG=$('bgG');
const lCh=$('lCh'),lvCh=$('lvCh'),cCh=$('cCh'),hCh=$('hCh'),hO=$('hO'),hCl=$('hCl'),hCb=$('hCb'),hCo=$('hCo');
const tO=$('tO'),tS=$('tS'),tT=$('tT'),tB=$('tB'),tN=$('tN'),tSk=$('tSk'),tP=$('tP'),tNA=$('tNA');

const BW=2,DEF_R=28,INIT_R=55,RH_THR=200,SSW=28,HOLD_THR=900,CASH_R=38,DIA_R=36;
const circle={x:0,y:0,radius:INIT_R,dx:0,dy:0,isDragging:false,dragTouchId:null,wasDraggingWhenPaused:false,lastX:0,lastY:0,lastTime:0,
wc:{left:{t:0,c:false},right:{t:0,c:false},top:{t:0,c:false},bottom:{t:0,c:false},boundary:{t:0,c:false}},
resizeTouchId:null,isResizing:false,resizeStartX:0,resizeStartY:0,initR:INIT_R,rsTime:0,rsTimer:null,hasBeenTouched:false};
const GRAV=0.48,FRIC=0.982,BOUNCE=0.88;
const TGT=1,TG=1.01,BASE_TM=TGT/Math.pow(TG,199);let throwMul=BASE_TM;
let isCD=false,cdVal=3,cdInt=null,cdOp=0,wallHits=0,level=1,isTrack=false;
let lives=3,hiScore=0,coins=0,potential=0,isPaused=false;
const hiScores={'survival-rectangle':0,'freebie-rectangle':0,'survival-circle':0,'freebie-circle':0};
let prevL=lives,prevLv=level,prevHS=hiScore,prevC=coins,startL=lives,suppress=false;
let mode='survival',map='rectangle',active=true,curInc=2,nextCO=2,cashAvail=false;
const trail=[];let holdT={play:null,mode:null,map:null,store:null,help:null};
let btnAct={play:false,mode:false,map:false,store:false,help:false};
let gSec=null,rSec=null,pgSec=null,prSec=null,ngSec=null,nrSec=null,pLand=null;
let holes=[],diaX=0,diaY=0,particles=[];
const gold={x:0,y:0,hx:0,hy:0,r:38,drag:false,tid:null,ox:0,oy:0,wob:false,wT:0,wA:0,wDx:0,wDy:0,phase:null,fVx:0,fVy:0};
let mergeA=0,mergeP=[],arrP=0,rightResize=false;

const SKINS=[
{id:'default',n:'Classic',p:0,c:{f:'rgba(255,255,255,0.65)',s:'#ffffff',g:'#ffffff'},face:'none'},
{id:'neon',n:'Neon Pulse',p:100,c:{f:'rgba(0,240,255,0.55)',s:'#00f0ff',g:'#00f0ff'},face:'none'},
{id:'emerald',n:'Emerald',p:150,c:{f:'rgba(0,255,136,0.5)',s:'#00ff88',g:'#00ff88'},face:'none'},
{id:'gold',n:'Golden Orb',p:250,c:{f:'rgba(255,215,0,0.55)',s:'#ffd700',g:'#ffd700'},face:'none'},
{id:'magenta',n:'Plasma',p:350,c:{f:'rgba(255,0,170,0.5)',s:'#ff00aa',g:'#ff00aa'},face:'ring'},
{id:'ice',n:'Frost',p:450,c:{f:'rgba(180,230,255,0.5)',s:'#a0e0ff',g:'#80d0ff'},face:'crystal'},
{id:'fire',n:'Inferno',p:600,c:{f:'rgba(255,80,0,0.55)',s:'#ff4400',g:'#ff6600'},face:'ember'},
{id:'void',n:'Void',p:800,c:{f:'rgba(40,0,60,0.7)',s:'#aa00ff',g:'#8800ff'},face:'spiral'},
{id:'chrome',n:'Chrome',p:1000,c:{f:'rgba(200,210,220,0.7)',s:'#e0e8f0',g:'#c0d0e0'},face:'glint'},
{id:'toxic',n:'Toxic',p:1400,c:{f:'rgba(120,255,40,0.5)',s:'#88ff00',g:'#66ff00'},face:'bio'},
{id:'prism',n:'Prism',p:2000,c:{f:'rgba(255,100,200,0.45)',s:'#ff66cc',g:'#ff99dd'},face:'facets'},
{id:'solar',n:'Solar Flare',p:2800,c:{f:'rgba(255,180,40,0.55)',s:'#ffaa00',g:'#ffcc44'},face:'rays'},
{id:'quantum',n:'Quantum',p:3600,c:{f:'rgba(80,40,255,0.55)',s:'#6644ff',g:'#8866ff'},face:'orbit'},
{id:'nova',n:'Supernova',p:4500,c:{f:'rgba(255,255,255,0.4)',s:'#ffffff',g:'#ffeeaa'},face:'burst'},
{id:'abyss',n:'Abyss',p:5000,c:{f:'rgba(5,5,20,0.85)',s:'#3344aa',g:'#2233ff'},face:'eye'}
];
const BGS=[
{id:'default',n:'Deep Space',p:0,t:'solid'},{id:'grid',n:'Neon Grid',p:120,t:'grid'},
{id:'stars',n:'Starfield',p:200,t:'stars'},{id:'aurora',n:'Aurora',p:350,t:'aurora'},
{id:'circuit',n:'Circuit',p:500,t:'circuit'},{id:'lava',n:'Lava Flow',p:700,t:'lava'},
{id:'ocean',n:'Deep Ocean',p:1000,t:'ocean'},{id:'matrix',n:'Matrix Rain',p:1500,t:'matrix'},
{id:'nebula',n:'Nebula',p:2200,t:'nebula'},{id:'horizon',n:'Event Horizon',p:3200,t:'horizon'},
{id:'glitch',n:'Glitch City',p:4200,t:'glitch'},{id:'singularity',n:'Singularity',p:5000,t:'singularity'}
];
let ownedS=new Set(['default']),ownedB=new Set(['default']),eqS='default',eqB='default';

function saveP(){const k=mode+'-'+map;hiScores[k]=Math.max(hiScores[k]||0,hiScore);
try{localStorage.setItem('megaBounceSave',JSON.stringify({coins,hiScores,ownedS:[...ownedS],ownedB:[...ownedB],eqS,eqB}))}catch(e){}}
function loadP(){try{const d=JSON.parse(localStorage.getItem('megaBounceSave')||'{}');coins=d.coins||0;if(d.hiScores)Object.assign(hiScores,d.hiScores);
if(d.ownedS)ownedS=new Set(d.ownedS);if(d.ownedB)ownedB=new Set(d.ownedB);eqS=d.eqS||'default';eqB=d.eqB||'default'}catch(e){}}
function gHS(){return hiScores[mode+'-'+map]||0}
function sHS(v){const k=mode+'-'+map;hiScores[k]=Math.max(hiScores[k]||0,v);hiScore=hiScores[k]}

const GS={};
['survival-rectangle','freebie-rectangle','survival-circle','freebie-circle'].forEach(k=>{
GS[k]={level:1,lives:k.startsWith('free')?Infinity:3,wallHits:0,isTrack:false,isPaused:false,isCD:false,cdVal:3,cdOp:0,wasDrag:false,startL:k.startsWith('free')?Infinity:3,cashAvail:false,nextCO:2,curInc:2,circle:{},trail:[],gSec:null,rSec:null,pgSec:null,prSec:null,ngSec:null,nrSec:null,pLand:null};
});

function randSec(){const s=[0,1,2];const g=s.splice(Math.floor(Math.random()*s.length),1)[0];const r=s.splice(Math.floor(Math.random()*s.length),1)[0];return{g,r}}
function asCur(){if(mode!=='survival'||map!=='rectangle'){gSec=rSec=null;return}const s=randSec();gSec=s.g;rSec=s.r}
function asNext(){if(mode!=='survival'||map!=='rectangle'){ngSec=nrSec=null;return}const s=randSec();ngSec=s.g;nrSec=s.r}
function updTM(){throwMul=BASE_TM*Math.pow(TG,level-1)}
function skinC(){return(SKINS.find(s=>s.id===eqS)||SKINS[0]).c}
function skinF(){return(SKINS.find(s=>s.id===eqS)||SKINS[0]).face||'none'}

function setSize(){
const vw=document.documentElement.clientWidth||window.innerWidth||320;
const vh=document.documentElement.clientHeight||window.innerHeight||600;
// Match CSS insets: 2.5vw sides, with a small gap above and below the playfield
const padX=vw*0.025;
const top=98, bot=54;
const sw=Math.max(200, vw-padX*2);
const sh=Math.max(220, vh-top-bot);
// Explicitly size canvas so it always matches (canvas ignores top/bottom stretch)
canvas.style.left=padX+'px';
canvas.style.right=padX+'px';
canvas.style.width=sw+'px';
canvas.style.top=top+'px';
canvas.style.height=sh+'px';
canvas.style.bottom='auto';
const pr=Math.min(window.devicePixelRatio||1,2);
const bw=Math.max(1,Math.floor(sw*pr));
const bh=Math.max(1,Math.floor(sh*pr));
if(canvas.width!==bw||canvas.height!==bh){
canvas.width=bw;
canvas.height=bh;
}
ctx.setTransform(pr,0,0,pr,0,0);
// Buttons + top bar share the same horizontal edges
const bb=$('bB'),tb=$('topBar');
if(bb){bb.style.left=padX+'px';bb.style.right=padX+'px';bb.style.width=sw+'px';}
if(tb){tb.style.left=padX+'px';tb.style.right=padX+'px';tb.style.width=sw+'px';}

function constrain(){

}

else if(bg.t==='circuit'){ctx.strokeStyle='rgba(0,200,180,0.1)';for(let x=20;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);for(let y=0;y<h;y+=30)ctx.lineTo(x+(y%60===0?15:-15),y);ctx.stroke()}}
else if(bg.t==='lava'){const g=ctx.createLinearGradient(0,h,0,0);g.addColorStop(0,'rgba(80,10,0,0.4)');g.addColorStop(1,'rgba(20,5,0,0.1)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}

else if(bg.t==='glitch'){for(let i=0;i<12;i++){ctx.fillStyle=`rgba(${i%2?0:200},${i%3?255:0},${i%2?200:50},0.06)`;ctx.fillRect(0,(i*73)%h,w,4+(i%5))}}

function drawFace(cx,cy,r,face,stroke){
if(!face||face==='none')return;ctx.save();ctx.strokeStyle=stroke;ctx.fillStyle=stroke;ctx.globalAlpha=0.55;ctx.lineWidth=1.5;
if(face==='ring'){ctx.beginPath();ctx.arc(cx,cy,r*0.45,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,r*0.25,0,Math.PI*2);ctx.stroke()}
else if(face==='crystal'){for(let i=0;i<6;i++){const a=i/6*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r*0.7,cy+Math.sin(a)*r*0.7);ctx.stroke()}}
else if(face==='ember'){for(let i=0;i<8;i++){const a=i/8*Math.PI*2;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r*0.35,cy+Math.sin(a)*r*0.35,r*0.12,0,Math.PI*2);ctx.fill()}}
else if(face==='spiral'){ctx.beginPath();for(let t=0;t<3;t+=0.05){const a=t*Math.PI*2,rr=r*0.15+t*r*0.2;if(t===0)ctx.moveTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);else ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}ctx.stroke()}
else if(face==='glint'){ctx.beginPath();ctx.moveTo(cx-r*0.4,cy);ctx.lineTo(cx+r*0.4,cy);ctx.moveTo(cx,cy-r*0.4);ctx.lineTo(cx,cy+r*0.4);ctx.stroke()}
else if(face==='bio'){for(let i=0;i<5;i++){const a=i/5*Math.PI*2;ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*r*0.3,cy+Math.sin(a)*r*0.3,r*0.18,r*0.1,a,0,Math.PI*2);ctx.stroke()}}
else if(face==='facets'){ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*Math.PI*2-Math.PI/8;const px=cx+Math.cos(a)*r*0.55,py=cy+Math.sin(a)*r*0.55;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.closePath();ctx.stroke()}
else if(face==='rays'){for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r*0.2,cy+Math.sin(a)*r*0.2);ctx.lineTo(cx+Math.cos(a)*r*0.75,cy+Math.sin(a)*r*0.75);ctx.stroke()}}
else if(face==='orbit'){ctx.beginPath();ctx.ellipse(cx,cy,r*0.55,r*0.25,0.4,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(cx,cy,r*0.25,r*0.55,-0.3,0,Math.PI*2);ctx.stroke()}
else if(face==='burst'){for(let i=0;i<16;i++){const a=i/16*Math.PI*2,len=i%2===0?0.7:0.4;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r*len,cy+Math.sin(a)*r*len);ctx.stroke()}}

ctx.restore();
}

function orbitText(cx,cy,r,text,color,fs){
const tot=text.length*4,ap=(2*Math.PI)/tot;ctx.font=`bold ${fs}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;
const starts=[-Math.PI/2,0,Math.PI/2,Math.PI];
for(let inst=0;inst<4;inst++)for(let i=0;i<text.length;i++){const a=starts[inst]+i*ap;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);ctx.fillText(text[i],0,0);ctx.restore()}
}

ctx.strokeStyle='rgba(0,240,255,0.7)';ctx.lineWidth=BW*2;ctx.shadowColor='rgba(0,240,255,0.4)';ctx.shadowBlur=8;

if(isPaused){ctx.fillStyle='rgba(0,180,255,0.07)';ctx.fillRect(0,0,w,h);ctx.strokeStyle=`rgba(255,215,0,${0.7+pulse*0.3})`;ctx.lineWidth=6;ctx.shadowBlur=24+pulse*16}

}

const sk=skinC();
if(trail.length>1){for(let i=0;i<trail.length-1;i++){const a=trail[i],b=trail[i+1],op=a.op*(1-i/trail.length)*0.4;ctx.beginPath();
let col='rgba(255,255,255,'+op+')';if(sk.g.startsWith('#')&&sk.g.length>=7){const r=parseInt(sk.g.slice(1,3),16),g=parseInt(sk.g.slice(3,5),16),bl=parseInt(sk.g.slice(5,7),16);col=`rgba(${r},${g},${bl},${op})`}

// soft glow

if(sk.g.startsWith('#')){let hex=sk.g.slice(1);if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];const hr=parseInt(hex.slice(0,2),16)||255,hg=parseInt(hex.slice(2,4),16)||255,hb=parseInt(hex.slice(4,6),16)||255;gr=`rgba(${hr},${hg},${hb},0.2)`}
const softR=circle.radius+30,sg=ctx.createRadialGradient(circle.x,circle.y,circle.radius*0.9,circle.x,circle.y,softR);

ctx.beginPath();ctx.strokeStyle='rgba(0,0,0,0.55)';ctx.lineWidth=1.5;const cs=13;ctx.moveTo(circle.x-cs,circle.y);ctx.lineTo(circle.x+cs,circle.y);ctx.moveTo(circle.x,circle.y-cs);ctx.lineTo(circle.x,circle.y+cs);ctx.stroke();

if(holdShow)orbitText(circle.x,circle.y,circle.radius+55,'HOLDING','#fff',20);

const off=circle.radius+26;ctx.font='bold 24px Orbitron,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';

ctx.fillStyle='#00ff88';ctx.shadowColor='#00ff88';const d=off*0.707;

// Dim the play area first so gold/blue stay bright on top

if(cashAvail&&mode==='survival'&&(isPaused||mergeA>0)){
const gx=gold.x,gy=gold.y,gr=gold.r,over=isPaused&&Math.hypot(gx-diaX,gy-diaY)<gr+DIA_R-6;
if(mergeA<=0||gold.phase==='fling'){ctx.beginPath();ctx.arc(gx,gy,gr,0,Math.PI*2);ctx.fillStyle='rgba(255,215,0,0.85)';ctx.shadowColor='#ffd700';ctx.shadowBlur=28;ctx.fill();ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.stroke();ctx.shadowBlur=0}
if(isPaused&&mergeA<=0&&!over)orbitText(gx,gy,gr+16,'C A S H   O U T  ','#fff',15);
if(isPaused&&mergeA<=0){
ctx.beginPath();ctx.arc(diaX,diaY,DIA_R,0,Math.PI*2);ctx.fillStyle='rgba(0,230,255,0.7)';ctx.shadowColor='#00e5ff';ctx.shadowBlur=20;ctx.fill();ctx.strokeStyle='#00e5ff';ctx.lineWidth=2.5;ctx.stroke();ctx.shadowBlur=0;

if(over)orbitText(gx,gy,gr+22,'LET GO  ','#00e5ff',15);

hCo.innerHTML="<h3>The Goal<\/h3><p>Stop the ball in its tracks when its bounce count exactly matches the level number. Level 1 needs exactly 1 bounce, level 2 needs exactly 2, and so on. One bounce over or under and you lose a life (Survival). Lives also act as your score multiplier. Level starts at 1 and resets to 1 when a new Survival game starts.<\/p>\n<p>The right number in the center box is the target. The left number is your live bounce count.<\/p>\n<h3>Throwing &amp; Submitting<\/h3>\n<ul><li>Tap anywhere inside the play area to spawn the ball at that spot. It will fall under gravity from there.<\/li>\n<li>If you keep holding after the tap, the ball stays in your grasp until you release or fling it.<\/li>\n<li>The first tap also starts a <strong>3-second countdown<\/strong>. That countdown is the time window you have to stack up bounces; after the countdown, the next touch in the map will submit your bounce count. At higher levels you will often need several throws inside those 3 seconds because gravity slows the ball down.<\/li>\n<li>Bounces keep counting during the countdown and after it ends.<\/li>\n<li>To <strong>submit<\/strong> your current bounce count: after the countdown (or even during it once you have started), tap, hold, or flick anywhere inside the map. That action locks in the result and resets the countdown for either your next try at that level, or the next level if the bounce count matched the level number.<\/li>\n<li>The crosshair in the center of the ball marks the exact position used when you submit.<\/li><\/ul>\n<h3>Survival Mode (MEGA BOUNCE)<\/h3>\n<p>You have limited lives. Each new run starts with <strong>3 lives<\/strong>, and lives reset to 3 when a new game begins (after cash-out or game over). On the Rectangle map the play area is split into three horizontal zones. When you clear a level, the zone the ball is in at the moment you submit changes your lives (the +/- numbers adjust at lower life amounts):<\/p>\n<ul><li><span style=\"color:#00ff88\">Green<\/span> &rarr; gain a life<\/li><li><span style=\"color:#ff3355\">Red<\/span> &rarr; lose a life<\/li><li>Black &rarr; no change<\/li><\/ul>\n<p>The side strips show the previous and upcoming zone colors (left and right sides, respectively). You can see which color you previously landed on (outlined in white), and which colors are next up.<\/p>\n<p><strong>Potential payout<\/strong> = the last level you beat this run &times; your current lives.<\/p>\n<h3>Lives Recovery<\/h3>\n<p>The +/- numbers on the zones adjust at lower lives amounts based on how many lives you started the level with:<\/p>\n<ul><li><strong>Started at 3 or more lives:<\/strong> If you drop below 3, black returns you to 3, green bumps you up to 4, red keeps you at or returns you to 2.<\/li>\n<li><strong>Started at 2 lives:<\/strong> If you drop below 2, black returns you to 2, green bumps you up to 3, red keeps you at 1.<\/li>\n<li><strong>Started at 1 life:<\/strong> Black and red keep you at 1, green bumps you to 2.<\/li><\/ul>\n<h3>Cash Out<\/h3>\n<p>The first cash-out opportunity appears when you reach <strong>level 2<\/strong>. After that, each time you skip an opportunity (by clearing the level without cashing out), the wait until the next one grows by one level \u2014 so the gaps are 2 levels, then 3, then 4, and so on.<\/p>\n<p>When it is available, the map border and Pause button pulse gold, and the Pause button reads &ldquo;PAUSE/ CASH OUT&rdquo; (on two lines). Cash out now if you want, or keep playing for a later shot. Pause to bring up the gold circle and blue $. Drag the gold circle onto the blue $ and release to cash out: you receive $ equal to (last level beaten &times; current lives) and the run resets.<\/p>\n<h3>Free Mode (FREE BOUNCE)<\/h3>\n<p>Infinite lives. Every successful level awards +1 $. Ideal for practice, and unlimited attempts to beat levels &mdash; the level you reach is saved and never resets.<\/p>\n<h3>Maps<\/h3>\n<ul><li><strong>Rectangle<\/strong> &mdash; four walls plus the colored life zones in Survival.<\/li><li><strong>Circle<\/strong> &mdash; circular boundary, no life zones.<\/li><\/ul>\n<h3>Extra Controls<\/h3>\n<ul>\n<li><strong>Resize (touch):<\/strong> hold the ball with one finger, place a second finger on the map, hold briefly, then drag that finger away to grow the ball or toward it to shrink it.<\/li>\n<li><strong>Resize (mouse):<\/strong> left-click and hold the ball, then right-click and drag <em>up<\/em> to grow or <em>down<\/em> to shrink.<\/li>\n<li><strong>Drop straight down (touch):<\/strong> while holding the ball, tap elsewhere on the map with another finger to release it so it falls straight down from your grasp.<\/li>\n<li><strong>Drop straight down (mouse):<\/strong> while left-click holding the ball, right-click once (without dragging) to drop it straight down.<\/li>\n<li>You can preserve the ball&rsquo;s holding state across pause/resume. While holding the ball, drag onto Pause, Map, Mode, Store, or Help and either wait for the button to glow-activate or simply release on it &mdash; both save the holding state. Resume the same way to continue with the ball still in your grasp. Tapping Resume without holding the ball resumes in a free (non-holding) state.<\/li>\n<\/ul>";

{t:'The Goal',b:'Stop the ball in its tracks when its bounce count exactly matches the level number. Level 1 needs 1 bounce, level 2 needs 2, and so on. The right number is the target; the left is your live bounce count. Lives also act as your score multiplier. You start with 3 lives; level and lives reset when a new Survival game starts.'},

const INFO={"potential": {"title": "POTENTIAL PAYOUT", "body": "<p>Your <strong>potential payout<\/strong> is the amount of $ you would receive if you cash out right now.<\/p>\n<p><strong>Formula:<\/strong> last level beaten this run &times; current lives<\/p>\n<p>Example: if you just cleared level 5 and have 3 lives, your potential is 5 &times; 3 = <strong>15 $<\/strong>.<\/p>\n<p>When you cash out (pause when the gold glow appears, drag the gold circle onto the blue $ and release), that potential is added to your $ balance and the Survival run resets.<\/p>\n<p>You can also keep playing to try for a higher payout later \u2014 the choice is yours each time cash-out becomes available.<\/p>"}, "lives": {"title": "LIVES", "body": "<p>Lives act as your <strong>score multiplier<\/strong> for the potential payout (last level beaten &times; current lives).<\/p>\n<p>You start each new Survival run with <strong>3 lives<\/strong>, and lives reset to 3 whenever a new game starts (after a cash-out or when you run out of lives).<\/p>\n<p><strong>Recovery on the Rectangle map:<\/strong> when you clear a level, the zone you land in adjusts lives based on how many you started the level with:<\/p>\n<ul><li><strong>Started at 3+:<\/strong> if you drop below 3, black returns you to 3, green to 4, red to 2.<\/li>\n<li><strong>Started at 2:<\/strong> if you drop below 2, black returns you to 2, green to 3, red keeps you at 1.<\/li>\n<li><strong>Started at 1:<\/strong> black and red keep you at 1, green bumps you to 2.<\/li><\/ul>"}, "bounces": {"title": "BOUNCE COUNT", "body": "<p>The <strong>left number<\/strong> is your live bounce count. The <strong>right number<\/strong> is the target for this level.<\/p>\n<p>To level up, that left number must <strong>exactly match<\/strong> the level number when you submit \u2014 either:<\/p>\n<ul><li>the first touch on the map after the countdown ends, or<\/li>\n<li>a touch during the countdown while the numbers already match.<\/li><\/ul>\n<p>One bounce over or under and you lose a life in Survival.<\/p>"}, "level": {"title": "LEVEL", "body": "<p>The level number is the bounce target for this round and also feeds into your potential payout multiplier (last level beaten &times; lives).<\/p>\n<p>Level starts at <strong>1<\/strong> and resets to 1 whenever a new Survival game starts (after cash-out or running out of lives).<\/p>\n<p>In Free mode the level you reach is saved and does not reset.<\/p>"}, "hiscore": {"title": "HI-SCORE", "body": "<p>Your hi-score is the <strong>highest level you have beaten<\/strong>.<\/p>\n<p>Hi-scores are saved <strong>separately for each mode and map combination<\/strong> (Survival Rectangle, Survival Circle, Free Rectangle, Free Circle), so each has its own best.<\/p>"}};
